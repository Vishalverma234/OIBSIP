<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
        }

        .subtitle {
            color: white;
            margin-bottom: 25px;
        }

        .converter {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2196f3;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2196f3;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1479c9;
        }

        #error {
            color: #e63946;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .results {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .results h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 13px;
            margin-bottom: 10px;
            background: #f3f8ff;
            border-radius: 8px;
        }

        .result-item span {
            font-weight: bold;
            color: #1479c9;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Temperature Converter</h1>

        <p class="subtitle">
            Convert Celsius, Fahrenheit and Kelvin
        </p>

        <div class="converter">

            <label for="temperature">
                Enter Temperature
            </label>

            <input
                type="number"
                id="temperature"
                placeholder="Enter temperature"
                step="any"
            >

            <label for="unit">
                Select Unit
            </label>

            <select id="unit">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>

            <button id="convertBtn">
                Convert
            </button>

            <div id="error"></div>

            <div class="results">

                <h2>Results</h2>

                <div class="result-item">
                    <span>Celsius</span>
                    <span id="celsius">-- °C</span>
                </div>

                <div class="result-item">
                    <span>Fahrenheit</span>
                    <span id="fahrenheit">-- °F</span>
                </div>

                <div class="result-item">
                    <span>Kelvin</span>
                    <span id="kelvin">-- K</span>
                </div>

            </div>

        </div>

    </div>


    <script>

        const button = document.getElementById("convertBtn");

        button.addEventListener("click", function () {

            const input = document.getElementById("temperature").value;
            const unit = document.getElementById("unit").value;

            const error = document.getElementById("error");

            const celsiusOutput =
                document.getElementById("celsius");

            const fahrenheitOutput =
                document.getElementById("fahrenheit");

            const kelvinOutput =
                document.getElementById("kelvin");


            // Clear old error
            error.textContent = "";


            // Check empty input
            if (input.trim() === "") {

                error.textContent =
                    "Please enter a temperature.";

                clearResults();

                return;
            }


            const temperature = Number(input);


            // Check invalid input
            if (Number.isNaN(temperature)) {

                error.textContent =
                    "Please enter a valid number.";

                clearResults();

                return;
            }


            let celsius;


            // Celsius
            if (unit === "celsius") {

                celsius = temperature;

            }


            // Fahrenheit
            else if (unit === "fahrenheit") {

                celsius = (temperature - 32) * 5 / 9;

            }


            // Kelvin
            else if (unit === "kelvin") {

                celsius = temperature - 273.15;

            }


            // Absolute zero check
            if (celsius < -273.15) {

                error.textContent =
                    "Temperature cannot be below absolute zero (-273.15°C).";

                clearResults();

                return;
            }


            // Convert to Fahrenheit
            const fahrenheit =
                (celsius * 9 / 5) + 32;


            // Convert to Kelvin
            const kelvin =
                celsius + 273.15;


            // Display results
            celsiusOutput.textContent =
                celsius.toFixed(2) + " °C";

            fahrenheitOutput.textContent =
                fahrenheit.toFixed(2) + " °F";

            kelvinOutput.textContent =
                kelvin.toFixed(2) + " K";

        });


        function clearResults() {

            document.getElementById("celsius").textContent =
                "-- °C";

            document.getElementById("fahrenheit").textContent =
                "-- °F";

            document.getElementById("kelvin").textContent =
                "-- K";
        }

    </script>

</body>

</html>
